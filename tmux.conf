# Private herdr-pocket server only. Never reads or edits ~/.tmux.conf.
set -g mouse on
set -g default-terminal tmux-256color
set -g status-position bottom
set -g status-style 'bg=colour236,fg=white'
set -g status-left '#[bold,bg=colour24,fg=white]  ‹ Picker  #[default]'
set -g status-left-length 16
set -g status-right ''
set -g status-justify left
set -g window-status-format ''
set -g window-status-current-format ''
set -g status-interval 0
set -g escape-time 10
set -g set-titles off
set -g allow-rename off
# hc attach consumes Ctrl+backslash locally. Picker ignores it when unattached.
bind-key -n MouseDown1Status send-keys -t = -H 1c
bind-key -n MouseDown1StatusLeft send-keys -t = -H 1c
bind-key -n MouseDown1StatusRight send-keys -t = -H 1c
