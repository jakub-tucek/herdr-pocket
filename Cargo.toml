[package]
name = "herdr-pocket"
version = "0.2.0"
edition = "2024"
description = "Mobile SSH terminal for shared Herdr sessions and repository workspaces"
repository = "https://github.com/jakub-tucek/herdr-pocket"

[dependencies]
anyhow = "1"
crossterm = "0.29"
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
unicode-width = "0.2"
unicode-segmentation = "1"
vt100 = "0.16"
signal-hook = "0.3"

tempfile = "3"

[profile.release]
lto = "thin"
strip = true
